services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - PERSISTENCE=file # messages survive restarts
    volumes:
      - floci-data:/var/lib/floci

  floci-ui:
    image: floci/floci-ui:latest
    ports:
      - "4000:4500"
    environment:
      - FLOCI_ENDPOINT=http://floci:4566
    depends_on:
      - floci
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulsenotify
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  floci-data:
  redis-data:
  postgres-data:
